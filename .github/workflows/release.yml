name: Windows Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install and test
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]" pyinstaller
          pytest -q
          python tools/build_icon.py
          python main.py --smoke-gui
      - name: Resolve version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") { $version = "${{ github.ref_name }}" }
          else { $raw = python -c "import worker_time_list; print(worker_time_list.__version__)"; $version = "v$raw" }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build Windows executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name "WorkerTimeList" `
            --paths src `
            --icon "assets/worker-time-list.ico" `
            --collect-all ttkbootstrap `
            --collect-all reportlab `
            --collect-all pymupdf `
            --add-data "assets/worker-time-list.ico;assets" `
            --add-data "assets/worker-time-list.png;assets" `
            --add-data "assets/worker-time-list.svg;assets" `
            main.py
      - name: Packaged smoke tests
        shell: pwsh
        run: |
          if (!(Test-Path "dist/WorkerTimeList.exe")) { throw "EXE missing" }
          if ((Get-Item "dist/WorkerTimeList.exe").Length -lt 1000000) { throw "EXE unexpectedly small" }
          $versionProcess = Start-Process -FilePath ".\dist\WorkerTimeList.exe" -ArgumentList "--version" -Wait -PassThru
          if ($versionProcess.ExitCode -ne 0) { throw "Version smoke test failed" }
          $guiProcess = Start-Process -FilePath ".\dist\WorkerTimeList.exe" -ArgumentList "--smoke-gui" -Wait -PassThru
          if ($guiProcess.ExitCode -ne 0) { throw "Packaged GUI smoke test failed" }
      - name: Package and checksum
        shell: pwsh
        run: |
          $zip = "Worker-Time-List-Generator-$env:VERSION-Windows-x64.zip"
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "dist/WorkerTimeList.exe" "release/WorkerTimeList.exe"
          Copy-Item "README.md" "release/README.md"
          Copy-Item "CHANGELOG.md" "release/CHANGELOG.md"
          Compress-Archive -Path "release/*" -DestinationPath $zip -Force
          $exeHash = (Get-FileHash "dist/WorkerTimeList.exe" -Algorithm SHA256).Hash.ToLower()
          "$exeHash  WorkerTimeList.exe" | Set-Content "dist/WorkerTimeList.exe.sha256"
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$zipHash  $zip" | Set-Content "$zip.sha256"
          "ZIP_NAME=$zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Worker Time List Generator ${{ env.VERSION }}
          generate_release_notes: true
          make_latest: true
          files: |
            dist/WorkerTimeList.exe
            dist/WorkerTimeList.exe.sha256
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256
