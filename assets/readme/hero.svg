<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Worker Time List Generator</title>
  <desc id="desc">SWIR project banner for a multilingual desktop timesheet with PDF and CSV export.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#02050A"/><stop offset="0.55" stop-color="#06101A"/><stop offset="1" stop-color="#02050A"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0088FF"/><stop offset="0.45" stop-color="#62E5FF"/><stop offset="1" stop-color="#0088FF"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#62E5FF" stroke-opacity="0.055"/></pattern>
  </defs>
  <rect width="1200" height="320" rx="26" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="318" rx="25" fill="none" stroke="#62E5FF" stroke-opacity="0.25"/><rect width="1200" height="320" rx="26" fill="url(#grid)"/>
  <path d="M0 250 C180 210 250 300 430 258 S720 214 885 248 S1070 282 1200 232" fill="none" stroke="url(#cyan)" stroke-opacity="0.24" stroke-width="2"/>
  <g transform="translate(72 74)"><rect width="150" height="150" rx="30" fill="#07111C" stroke="#62E5FF" stroke-opacity="0.5"/><circle cx="75" cy="75" r="46" fill="none" stroke="#62E5FF" stroke-width="7" filter="url(#glow)"/><path d="M75 44V78L101 94" fill="none" stroke="#F4FAFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M32 128H118" stroke="#0088FF" stroke-width="6" stroke-linecap="round"/></g>
  <text x="270" y="70" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#62E5FF">SWIR PROJECT</text>
  <text x="270" y="142" font-family="Segoe UI,Arial,sans-serif" font-size="48" font-weight="800" fill="#F4FAFF">WORKER TIME LIST GENERATOR</text>
  <text x="272" y="190" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="500" fill="#B8D2E0">Multilingual desktop timesheets without cloud lock-in</text>
  <text x="272" y="232" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="650" letter-spacing="1.5" fill="#62E5FF">WINDOWS  •  PYTHON  •  PDF / CSV  •  PL / NO / EN</text>
</svg>
